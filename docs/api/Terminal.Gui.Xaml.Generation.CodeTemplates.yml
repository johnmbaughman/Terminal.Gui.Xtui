  summary: Default template for generated classes.
  example: []
  syntax:
    content: 'public const string DefaultClassTemplate = "// <auto-generated/>\r\nnamespace {NAMESPACE} {{\r\n    /// <summary>Generated from XAML</summary>\r\n    public partial class {CLASSNAME} {{\r\n        public void InitializeComponent() {{ /* XAML parsing logic */ }}\r\n        // TODO: Add fields for named elements\r\n        // TODO: Add event handler stubs\r\n    }}\r\n}}"'
    return:
      type: System.String
    content.vb: 'Public Const DefaultClassTemplate As String = "// <auto-generated/>" & vbCrLf & "namespace {NAMESPACE} {{" & vbCrLf & "    /// <summary>Generated from XAML</summary>" & vbCrLf & "    public partial class {CLASSNAME} {{" & vbCrLf & "        public void InitializeComponent() {{ /* XAML parsing logic */ }}" & vbCrLf & "        // TODO: Add fields for named elements" & vbCrLf & "        // TODO: Add event handler stubs" & vbCrLf & "    }}" & vbCrLf & "}}"'
