name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      run_count:
        description: 'Number of benchmark runs'
        required: false
        default: '5'
  push:
    branches:
      - 'v0.0.0.1'
      - 'v0.0.0.1/**'
    paths:
      - 'Terminal.Gui.Xtui/Generators/**'
      - 'Terminal.Gui.Xtui.Benchmarks/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Add NuGet sources
      working-directory: src
      run: |
        dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org || true

    - name: Debug NuGet configuration and sources
      working-directory: src
      continue-on-error: true
      run: |
        echo "=== dotnet nuget list source ==="
        dotnet nuget list source --format short || true
        echo "=== Listing src/NuGet.Config if present ==="
        if [ -f NuGet.Config ]; then
          echo "--- src/NuGet.Config ---"
          sed -n '1,200p' NuGet.Config || cat NuGet.Config
        else
          echo "(no src/NuGet.Config found)"
        fi
        echo "=== Running diagnostic restore (non-fatal) ==="
        dotnet restore Terminal.Gui.Xtui.sln -v diag || true
        
    - name: Restore dependencies
      working-directory: src
      run: dotnet restore Terminal.Gui.Xtui.sln
      
    - name: Build benchmark project
      run: dotnet build Terminal.Gui.Xtui.Benchmarks/Terminal.Gui.Xtui.Benchmarks.csproj --configuration Release --no-restore
      
    - name: Run benchmarks with code metrics
      run: |
        # Install PowerShell on Linux
        if ! command -v pwsh &> /dev/null; then
          echo "Installing PowerShell..."
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
        fi
        
        # Run benchmark script
        pwsh -File scripts/run-benchmarks.ps1 -RunCount ${{ github.event.inputs.run_count || '5' }}
      
    - name: Upload benchmark artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks-${{ github.run_id }}
        path: |
          artifacts/benchmarks/summary.json
          artifacts/benchmarks/raw-runs-*.json
        retention-days: 90
        
    - name: Display benchmark summary
      run: |
        if [ -f artifacts/benchmarks/summary.json ]; then
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat artifacts/benchmarks/summary.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Compare with baseline (if available)
      id: compare
      continue-on-error: true
      run: |
        if [ -f artifacts/benchmarks/baseline-summary.json ]; then
          pwsh -File scripts/compare-benchmarks.ps1 -BaselinePath artifacts/benchmarks/baseline-summary.json -CurrentPath artifacts/benchmarks/summary.json
        else
          echo "::warning::No baseline found for comparison. Run T013 to establish baseline."
        fi
