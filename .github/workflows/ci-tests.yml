name: CI Tests

on:
  push:
    branches:
      - 'v0.0.0.1'
      - 'v0.0.0.1/**'
  pull_request:
    branches:
      - 'v0.0.0.1'
      - 'v0.0.0.1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Add NuGet sources
      working-directory: src
      run: |
        dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org || true

    - name: Debug NuGet configuration and sources
      working-directory: src
      continue-on-error: true
      run: |
        echo "=== dotnet nuget list source ==="
        dotnet nuget list source --format short || true
        echo "=== Listing src/NuGet.Config if present ==="
        if [ -f NuGet.Config ]; then
          echo "--- src/NuGet.Config ---"
          sed -n '1,200p' NuGet.Config || cat NuGet.Config
        else
          echo "(no src/NuGet.Config found)"
        fi
        echo "=== Running diagnostic restore (non-fatal) ==="
        dotnet restore Terminal.Gui.Xtui.sln -v diag || true

    - name: Create temporary NuGet.Config for CI restore
      working-directory: src
      run: |
        cat > ci-temp-nuget.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF
        
    - name: Verify Constitution compliance check exists
      working-directory: src
      run: |
        if [ ! -f "specs/001-refactor-generators/CONSTITUTION_CHECK.md" ]; then
          echo "::error::Constitution compliance check file not found"
          exit 1
        fi
        echo "✓ Constitution compliance check verified"
        
    - name: Restore dependencies
      working-directory: src
      run: dotnet restore Terminal.Gui.Xtui.sln --configfile ci-temp-nuget.config
      
    - name: Build solution
      working-directory: src
      run: dotnet build Terminal.Gui.Xtui.sln --configuration Release --no-restore
      
    - name: Run unit tests
      working-directory: src
      run: dotnet test Terminal.Gui.Xtui.Tests/Terminal.Gui.Xtui.Tests.csproj --configuration Release --no-build --verbosity normal
      
    - name: Run public generator API contract tests (T031)
      working-directory: src
      run: dotnet test Terminal.Gui.Xtui.Tests/Terminal.Gui.Xtui.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~PublicGeneratorApiTests" --verbosity normal
      
    - name: Run baseline generation integration tests (T015)
      working-directory: src
      run: dotnet test Terminal.Gui.Xtui.Tests/Terminal.Gui.Xtui.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~BaselineGenerationTests" --verbosity normal
      
    - name: Create artifacts directory
      run: mkdir -p artifacts/generated
      
    - name: Generate baseline output (T014)
      working-directory: src
      run: GENERATE_BASELINE=true dotnet test Terminal.Gui.Xtui.Tests/Terminal.Gui.Xtui.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~BaselineGenerationTests.GenerateBaseline_ForCI" --verbosity normal
      
    - name: Run baseline diff (T014)
      id: baseline_diff
      continue-on-error: true
      working-directory: src
      run: |
        if [ -f "refactor/generated-baseline.cs" ]; then
          git --no-pager diff --no-index --ignore-cr-at-eol refactor/generated-baseline.cs ../artifacts/generated/generated-baseline.cs > ../artifacts/generated/baseline-diff.txt || true
          if [ -s "../artifacts/generated/baseline-diff.txt" ]; then
            echo "::error::Baseline diff detected - generated output does not match refactor/generated-baseline.cs"
            cat ../artifacts/generated/baseline-diff.txt
            exit 1
          else
            echo "✓ Baseline parity verified"
          fi
        else
          echo "::warning::Baseline file refactor/generated-baseline.cs not found, skipping diff"
        fi
      
    - name: Upload baseline diff artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: baseline-diff
        path: |
          artifacts/generated/generated-baseline.cs
          artifacts/generated/baseline-diff.txt
        retention-days: 30
