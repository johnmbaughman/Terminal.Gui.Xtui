name: CI Tests

on:
  push:
    branches:
      - 'v0.0.0.1'
      - 'v0.0.0.1/**'
  pull_request:
    branches:
      - 'v0.0.0.1'
      - 'v0.0.0.1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Add NuGet sources
      working-directory: src
      run: |
        if dotnet nuget list source | grep -q "nuget.org"; then
          echo "nuget.org source already registered"
        else
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org
        fi

    - name: Create temporary NuGet.Config for CI restore
      working-directory: src
      run: |
        cat > ci-temp-nuget.config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF
        
    - name: Restore dependencies
      working-directory: src
      run: dotnet restore Terminal.Gui.Xtui.sln --configfile ci-temp-nuget.config
      
    - name: Build solution
      working-directory: src
      run: dotnet build Terminal.Gui.Xtui.sln --configuration Release --no-restore
      
    - name: Run unit tests
      working-directory: src
      run: dotnet test Terminal.Gui.Xtui.Tests/Terminal.Gui.Xtui.Tests.csproj --configuration Release --no-build --verbosity normal
