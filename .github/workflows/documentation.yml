name: Documentation Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/documentation.yml'
      - 'Directory.Build.*'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build DocFX Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Terminal.Gui.Xaml.sln

      - name: Build (No Docs)
        run: dotnet build Terminal.Gui.Xaml.sln -c Release --no-restore

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build Documentation
        working-directory: docs
        run: docfx build

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docfx-site
          path: docs/_site
          if-no-files-found: error

      - name: Upload Search Index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docfx-search-index
          path: docs/_site/index.json
          if-no-files-found: warn

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: docfx-site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post Deployment Summary
        run: |
          echo "Documentation deployed to GitHub Pages at: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
