name: Version Matrix Validation

on:
  push:
    branches: [ main, develop, '**/feature/**', '**/feat/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Version & Compatibility Matrix Validation
        shell: pwsh
        run: |
          ./scripts/validate-version-matrix.ps1

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-matrix-report
          path: temp_test_validation/version-matrix-report.json

      - name: Archive matrix file on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: version-compatibility-md
          path: docs/articles/guides/version-compatibility.md

      - name: Show matrix excerpt
        if: success()
        shell: pwsh
        run: |
          Get-Content docs/articles/guides/version-compatibility.md | Select-String -Pattern '^\| 1\.' -Context 0,2
