name: PR Build (Tests + Docs)

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build, Test, and Docs (warnings as errors)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET SDK 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install DocFX tool
        shell: pwsh
        run: |
          dotnet tool update -g docfx --version 2.78.3
          # Ensure the global tools path is available in this session
          $tools = "$Env:USERPROFILE\.dotnet\tools"
          if (-not ($Env:PATH -split ';' | Where-Object { $_ -eq $tools })) {
            $Env:PATH = "$tools;$Env:PATH"
          }
          docfx --version

      - name: Run build script (warnings as errors)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Configuration Release -DocWarningsAsErrors -VerboseOutput
